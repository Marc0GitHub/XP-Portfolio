<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>XP</title>
</head>
<body>
    <div class="desktop">
        <div id="icon1" class="icon">
            <img src="assets/bin-icon.png" alt="My Computer">
            <span>Bin</span>
        </div>
        <div id="icon2" class="icon">
            <img src="assets/internet-explorer-2-icon.png" alt="My Documents">
            <span>Internet</span>
        </div>
        <div id="icon3" class="icon">
            <img src="assets/folder-icon.png" alt="Recycle Bin">
            <span>Folder</span>
        </div>
        <div id="icon4" class="icon">
            <img src="assets/paint-icon.png" alt="Paint">
            <span>Paint</span>
        </div>
        <div id="icon5" class="icon">
            <img src="assets/notepad-icon.png" alt="Notepad">
            <span>Notepad</span>
        </div>
    </div>

    <div class="start-menu hidden" id="start-menu">
        <div class="start-menu-header">
            <img src="assets/windows-xp-icon-logo-E8F84DD6F3-seeklogo.com.png" alt="">
            <span>Your Name</span>
        </div>
        <div class="start-menu-items">
            <div class="start-menu-item" data-target="icon2">
                <img src="assets/internet-explorer-2-icon.png" alt="">
                <span>Internet Explorer</span>
            </div>
            <div class="start-menu-item" data-target="icon4">
                <img src="assets/paint-icon.png" alt="">
                <span>Paint</span>
            </div>
            <div class="start-menu-item" data-target="icon5">
                <img src="assets/notepad-icon.png" alt="">
                <span>Notepad</span>
            </div>
            <div class="start-menu-item" data-target="icon3">
                <img src="assets/folder-icon.png" alt="">
                <span>Folder</span>
            </div>
            <div class="start-menu-item" data-target="icon1">
                <img src="assets/bin-icon.png" alt="">
                <span>Bin</span>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <button id="start-button"><img src="assets/windows-xp-icon-logo-E8F84DD6F3-seeklogo.com.png" alt="">Start</button>
        <div class="taskbar-windows"></div>
        <div class="taskbar-clock" id="taskbar-clock"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
